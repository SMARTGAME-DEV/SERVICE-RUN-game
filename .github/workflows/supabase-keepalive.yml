name: Supabase leaderboard keepalive

on:
  schedule:
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read leaderboard without changing scores
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing SUPABASE_PUBLISHABLE_KEY repository secret"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept: application/json" \
            'https://jwxlxgpcvkclhecungyy.supabase.co/rest/v1/leaderboard?select=id&limit=1' \
            --output /dev/null
          echo "Supabase leaderboard responded successfully"
